<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff33c4">
  <meta name="description" content="这算出轨吗？40 个恋爱情境，找到你心里的那条线。支持简体中文与日语，一键切换、自动保存、导出判定表。">
  <title>这算出轨吗？判定表 / これって浮気？判定シート</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./fonts/fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./data.js?v=f77d349" defer></script>
  <script src="./core.js" defer></script>
  <script src="./app.js" defer></script>

<body>
  <a class="skip-link" href="#content">跳到问卷 / 質問へ</a>
  <div id="root"></div>
  <aside id="analytics-notice" style="max-width:760px;margin:18px auto 24px;padding:10px 14px;color:#777;font-size:12px;text-align:center">
    本网站使用匿名访问统计估算访客所在地区，不保存原始 IP，也不收集问卷答案。
    <button id="analytics-optout" type="button" style="margin-left:8px;border:0;background:transparent;text-decoration:underline;cursor:pointer;color:inherit">拒绝统计</button>
    <span lang="ja"> / 匿名アクセス解析を使用しています。生の IP アドレスや回答内容は保存しません。</span>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title"></h2>
    <p id="reset-description"></p>
    <div class="dialog-actions"><button id="cancel-reset" class="button secondary"></button><button id="confirm-reset" class="button primary"></button></div>
  </dialog>
  <noscript><p class="noscript">请启用 JavaScript 后填写问卷。JavaScript を有効にしてください。</p></noscript>
  <script>
    document.getElementById("analytics-optout").addEventListener("click", () => {
      try { localStorage.setItem("uwaki-analytics-optout", "1"); } catch {}
      document.getElementById("analytics-notice").textContent = "已拒绝访问统计 / アクセス解析を拒否しました。";
    });
  </script>
</body>
