<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>访客地图 · Uwaki Sheet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script defer src="../visitor-config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="dashboard">
    <header class="top">
      <div>
        <p class="eyebrow">UWAKI SHEET · PRIVATE ANALYTICS</p>
        <h1>访客地图</h1>
        <p class="sub">仅展示 IP 地理数据库估算位置，不代表访客 GPS 位置。</p>
      </div>
      <div class="controls">
        <select id="range" aria-label="统计时间范围">
          <option value="1">今天</option>
          <option value="7">最近 7 天</option>
          <option value="30" selected>最近 30 天</option>
          <option value="90">最近 90 天</option>
        </select>
        <button id="refresh">刷新</button>
      </div>
    </header>

    <div id="status" class="status" role="status">正在连接统计服务…</div>

    <section class="stats">
      <article><span>访问次数</span><strong id="total">—</strong></article>
      <article><span>国家 / 地区</span><strong id="countries">—</strong></article>
      <article><span>城市</span><strong id="cities">—</strong></article>
      <article><span>有坐标的访问</span><strong id="mapped">—</strong></article>
    </section>

    <section class="panel map-panel">
      <div class="panel-head"><h2>全球访客分布</h2><span>圆点大小代表访问次数</span></div>
      <div id="map" aria-label="全球访客分布地图"></div>
    </section>

    <section class="lower">
      <section class="panel">
        <div class="panel-head"><h2>访问趋势</h2></div>
        <div class="chart-wrap"><canvas id="timeline"></canvas></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>国家 / 地区排行</h2></div>
        <div id="country-list" class="country-list"></div>
      </section>
    </section>

    <section class="panel recent-panel">
      <div class="panel-head"><h2>最近访问（匿名化）</h2><span>不显示 IP 地址</span></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>时间（UTC）</th><th>国家 / 地区</th><th>城市</th><th>网络 ASN</th><th>页面</th></tr></thead>
          <tbody id="recent"><tr><td colspan="5">等待数据…</td></tr></tbody>
        </table>
      </div>
    </section>
    <footer>IP 仅用于请求期间的地理信息解析，数据库不保存原始 IP。坐标经过精度降低，可能存在较大误差。</footer>
  </main>
</body>
</html>
